name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for public app
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 20 https://memetogo.vercel.app/ || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Homepage did not return HTTP 200"
          exit 1

      - name: Verify environment health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://memetogo.vercel.app/api/health -o /tmp/health.json
          cat /tmp/health.json
          jq -e '.ok == true and .gmgnConfigured == true and .deepseekConfigured == true and .mode == "smart-kol-first" and .minMarketCap == 1000000' /tmp/health.json >/dev/null

      - name: Verify live GMGN feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 https://memetogo.vercel.app/api/feed -o /tmp/feed.json
          jq '{generatedAt, hardGate, projectCount:(.projects|length), diagnostics}' /tmp/feed.json
          jq -e '.hardGate.enabled == true and .hardGate.minMarketCap == 1000000 and .hardGate.requires == "smart_money_buy OR kol_buy" and (.projects|type) == "array" and (.diagnostics|type) == "array"' /tmp/feed.json >/dev/null
          jq -e '[.diagnostics[]?.errors[]?] | length == 0' /tmp/feed.json >/dev/null

      - name: Verify first project detail when available
        shell: bash
        run: |
          set -euo pipefail
          count=$(jq '.projects|length' /tmp/feed.json)
          if [ "$count" -eq 0 ]; then
            echo "No qualifying Smart Money/KOL project at this moment; detail smoke skipped."
            exit 0
          fi
          chain=$(jq -r '.projects[0].chain' /tmp/feed.json)
          address=$(jq -r '.projects[0].address' /tmp/feed.json)
          curl -fsS --max-time 90 "https://memetogo.vercel.app/api/token?chain=${chain}&address=${address}" -o /tmp/token.json
          jq '{symbol, chain, address, candles:(.candles|length), traderCount:(.topTraders|length), hasCulture:(.culture != null)}' /tmp/token.json
          jq -e '(.address|length) > 0 and (.candles|type) == "array" and (.topTraders|type) == "array"' /tmp/token.json >/dev/null
