name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for public app
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 20 https://memetogo.vercel.app/ || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Homepage did not return HTTP 200"
          exit 1

      - name: Verify environment health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://memetogo.vercel.app/api/health -o /tmp/health.json
          cat /tmp/health.json
          jq -e '.ok == true and .gmgnConfigured == true and .deepseekConfigured == true and .mode == "smart-kol-first" and .minMarketCap == 1000000' /tmp/health.json >/dev/null

      - name: Verify live GMGN feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 https://memetogo.vercel.app/api/feed -o /tmp/feed.json
          jq '{generatedAt, source, hardGate, projectCount:(.projects|length), diagnostics}' /tmp/feed.json
          jq -e '.source.mode == "newsalert-shared-collector" and .hardGate.enabled == true and .hardGate.minMarketCap == 1000000 and .hardGate.requires == "smart_money_buy OR kol_buy" and (.projects|type) == "array" and (.diagnostics|type) == "array"' /tmp/feed.json >/dev/null
          jq -e '[.diagnostics[]?.errors[]?] | length == 0' /tmp/feed.json >/dev/null

      - name: Verify project detail path
        shell: bash
        run: |
          set -euo pipefail
          count=$(jq '.projects|length' /tmp/feed.json)
          if [ "$count" -gt 0 ]; then
            chain=$(jq -r '.projects[0].chain' /tmp/feed.json)
            address=$(jq -r '.projects[0].address' /tmp/feed.json)
          else
            # Stable liquid Robinhood Chain token used only to exercise the detail plumbing.
            chain="robinhood"
            address="0x2e8c31162b855a2ffa90f6f8634643ad6f111e18"
          fi
          curl -fsS --max-time 90 "https://memetogo.vercel.app/api/token?chain=${chain}&address=${address}" -o /tmp/token.json
          jq '{symbol:.info.symbol, chain:.info.chain, address:.info.address, candles:(.candles|length), traderCount:(.traders|length), hasCulture:(.culture != null), dataSource, diagnostics}' /tmp/token.json
          jq -e '(.info.address|length) > 0 and (.candles|type) == "array" and (.traders|type) == "array" and (.culture != null) and .dataSource.identityFlow == "GMGN via Newsalert shared collector"' /tmp/token.json >/dev/null
